name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Format, Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test environment file
        run: |
          cat > .env.development <<EOF
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL=http://localhost:8787
          ALLOWED_ORIGINS=http://localhost:3000
          PORT=8787
          STRIPE_WEBHOOK_SECRET=whsec_test_secret_for_ci_only
          BILLING_CHECKOUT_RETURN_URL=http://localhost:3000/billing
          EOF

      - name: Create restricted app_user role
        # Runs before migrations, not after: create-app-role.js's ALTER DEFAULT
        # PRIVILEGES rule covers tables created afterward by the same connecting role,
        # so the role doesn't need any tables to exist first. It must exist before
        # migrations run because some migrations (e.g. 0019_billing_events_immutability)
        # reference `app_user` directly (REVOKE ... FROM app_user), not just via RLS
        # policies' current_setting(...) checks — those would fail with "role app_user
        # does not exist" on a fresh database otherwise. The default `postgres` role in
        # this ephemeral container is a superuser, which bypasses Row-Level Security same
        # as Neon's owner role does in dev — without this step, the RLS-proof test would
        # pass in CI for the wrong reason (still bypassing, just a different bypass). See
        # AGENTS.md's Row-Level Security section.
        run: APP_ROLE_PASSWORD=ci-app-user-password-not-a-real-secret pnpm --filter @repo/db create-app-role

      - name: Add APP_DATABASE_URL to test environment file
        run: echo "APP_DATABASE_URL=postgresql://app_user:ci-app-user-password-not-a-real-secret@localhost:5432/test" >> .env.development

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed subscription plans
        # 0017_seed_default_subscription_plans.sql only seeds the two free-tier default
        # plans (needed so entitlement/seat-limit checks have a fallback on a brand-new
        # billing row) — the paid tiers (`growth`, `individual_pro`, `starter`) this
        # script adds have only ever existed in local dev DBs via a manual one-off run,
        # never in CI's ephemeral database. entitlement.integration.test.ts's "upgrade to
        # a plan with the feature" cases need those paid-tier rows to exist or they always
        # fall through to fallbackEntitlements (deny-most) and return 402 regardless of
        # which plan the billing row is set to.
        run: pnpm --filter @repo/api seed:subscription-plans

      - name: Run tests
        run: pnpm test
